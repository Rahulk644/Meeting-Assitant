<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Live Transcript</title>
<style>
  :root{
    --bg:#0e1116; --panel:#151a21; --line:#222b36; --ink:#e6edf3; --mut:#8b98a8;
    --accent:#2dd4bf; --you:#2dd4bf;
    --r:14px;
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0; background:var(--bg); color:var(--ink);
    font:15px/1.55 -apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,sans-serif;
    display:flex; flex-direction:column; height:100vh;
  }
  header{
    display:flex; align-items:center; gap:14px; padding:14px 20px;
    border-bottom:1px solid var(--line); background:var(--panel);
  }
  .live{display:flex; align-items:center; gap:8px; font-weight:600; letter-spacing:.02em}
  .dot{width:9px;height:9px;border-radius:50%;background:#f2545b;box-shadow:0 0 0 0 rgba(242,84,91,.6);animation:p 1.6s infinite}
  @keyframes p{0%{box-shadow:0 0 0 0 rgba(242,84,91,.5)}70%{box-shadow:0 0 0 7px rgba(242,84,91,0)}100%{box-shadow:0 0 0 0 rgba(242,84,91,0)}}
  .title{color:var(--ink); font-weight:600}
  .sub{color:var(--mut); font-size:13px}
  .spacer{flex:1}
  .speaking{display:flex;align-items:center;gap:9px;color:var(--mut);font-size:13px}
  .speaking b{color:var(--ink)}
  .mic{width:16px;height:16px;opacity:.9}
  main{flex:1; overflow:hidden; display:flex}
  .rail{width:210px; border-right:1px solid var(--line); padding:16px 14px; overflow:auto; background:var(--panel)}
  .rail h3{margin:0 0 12px; font-size:11px; letter-spacing:.09em; text-transform:uppercase; color:var(--mut); font-weight:600}
  .who{display:flex; align-items:center; gap:9px; padding:7px 8px; border-radius:9px; margin-bottom:2px}
  .who.act{background:rgba(45,212,191,.10)}
  .av{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;font-size:12px;font-weight:700;color:#0e1116;flex:0 0 auto}
  .who .nm{font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .feed{flex:1; overflow:auto; padding:22px clamp(16px,4vw,48px); scroll-behavior:smooth}
  .wrap{max-width:760px;margin:0 auto}
  .row{display:flex; gap:13px; padding:11px 0; animation:in .28s ease}
  @keyframes in{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
  .row .av{width:34px;height:34px;font-size:14px;margin-top:1px}
  .body{min-width:0}
  .meta{display:flex;align-items:baseline;gap:9px;margin-bottom:1px}
  .nm2{font-weight:650}
  .ts{color:var(--mut);font-size:12px}
  .txt{color:#d3dbe4}
  .row.self .txt{color:var(--ink)}
  .row.self{padding-left:12px;border-left:2px solid var(--you);margin-left:-14px}
  .empty{color:var(--mut);text-align:center;margin-top:18vh}
  .empty .big{font-size:17px;color:var(--ink);margin-bottom:6px}
  footer{padding:8px 20px;border-top:1px solid var(--line);color:var(--mut);font-size:12px;background:var(--panel);display:flex;gap:16px}
  .ok{color:var(--accent)}
  ::-webkit-scrollbar{width:10px}::-webkit-scrollbar-thumb{background:#26303c;border-radius:8px}
</style>
</head>
<body>
  <header>
    <span class="live"><span class="dot"></span>LIVE</span>
    <div>
      <div class="title" id="title">Waiting for meeting…</div>
      <div class="sub" id="sub">Not in a call</div>
    </div>
    <span class="spacer"></span>
    <span class="speaking" id="speaking" hidden>
      <svg class="mic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2a3 3 0 0 0-3 3v6a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3z"/><path d="M19 10v1a7 7 0 0 1-14 0v-1M12 18v4"/></svg>
      <span>speaking: <b id="active">—</b></span>
    </span>
  </header>
  <main>
    <aside class="rail">
      <h3>In the room</h3>
      <div id="people"></div>
    </aside>
    <section class="feed" id="feed">
      <div class="wrap" id="wrap">
        <div class="empty" id="empty">
          <div class="big">Ready.</div>
          <div>Speaker-named lines will stream in as people talk.</div>
        </div>
      </div>
    </section>
  </main>
  <footer>
    <span id="conn">connecting…</span>
    <span class="spacer" style="flex:1"></span>
    <span id="count">0 lines</span>
  </footer>
<script>
const PALETTE = ["#f2a154","#6ea8fe","#f78fb3","#a5d4a4","#c792ea","#ffcb6b","#7ee787","#ff9492","#79c0ff","#d2a8ff"];
function colorFor(name){
  if(name==="You"||/\(you\)/i.test(name)) return getComputedStyle(document.documentElement).getPropertyValue('--you').trim();
  let h=0; for(const c of name) h=(h*31+c.charCodeAt(0))>>>0;
  return PALETTE[h%PALETTE.length];
}
function initials(n){return n.replace(/\(.*/,'').trim().split(/\s+/).slice(0,2).map(w=>w[0]||'').join('').toUpperCase()}
const feed=document.getElementById('feed'), wrap=document.getElementById('wrap'),
      empty=document.getElementById('empty'), people=document.getElementById('people'),
      titleEl=document.getElementById('title'), subEl=document.getElementById('sub'),
      speakingEl=document.getElementById('speaking'), activeEl=document.getElementById('active'),
      connEl=document.getElementById('conn'), countEl=document.getElementById('count');
let count=0, roster=[];
function fmt(ts){const d=ts?new Date(ts):new Date();return d.toLocaleTimeString([], {hour:'2-digit',minute:'2-digit',second:'2-digit'})}
function renderPeople(list,active){
  roster=list||roster;
  people.innerHTML='';
  for(const p of roster){
    const row=document.createElement('div'); row.className='who'+(p===active?' act':'');
    const av=document.createElement('div'); av.className='av'; av.style.background=colorFor(p); av.textContent=initials(p);
    const nm=document.createElement('div'); nm.className='nm'; nm.textContent=p;
    row.append(av,nm); people.append(row);
  }
}
function onState(s){
  if(s.title){titleEl.textContent=s.title}
  if(s.inMeeting!==undefined){subEl.textContent=s.inMeeting?(s.app?('on '+s.app):'in a call'):'Not in a call'}
  if(s.participants&&s.participants.length){renderPeople(s.participants,s.activeSpeaker)}
  if(s.activeSpeaker){speakingEl.hidden=false; activeEl.textContent=s.activeSpeaker; renderPeople(null,s.activeSpeaker)}
}
function addCaption(c){
  empty.style.display='none';
  const row=document.createElement('div'); row.className='row'+(c.self?' self':'');
  const av=document.createElement('div'); av.className='av'; av.style.background=colorFor(c.speaker); av.textContent=initials(c.speaker);
  const body=document.createElement('div'); body.className='body';
  const meta=document.createElement('div'); meta.className='meta';
  const nm=document.createElement('span'); nm.className='nm2'; nm.style.color=colorFor(c.speaker); nm.textContent=c.speaker;
  const ts=document.createElement('span'); ts.className='ts'; ts.textContent=fmt(c.ts);
  const txt=document.createElement('div'); txt.className='txt'; txt.textContent=c.text;
  meta.append(nm,ts); body.append(meta,txt); row.append(av,body); wrap.append(row);
  count++; countEl.textContent=count+' line'+(count===1?'':'s');
  const near = feed.scrollHeight-feed.scrollTop-feed.clientHeight < 200;
  if(near) feed.scrollTop=feed.scrollHeight;
}
const es=new EventSource('/events');
es.onopen=()=>{connEl.textContent='● connected'; connEl.className='ok'};
es.onerror=()=>{connEl.textContent='reconnecting…'; connEl.className=''};
es.onmessage=(e)=>{
  let m; try{m=JSON.parse(e.data)}catch{return}
  if(m.type==='state'&&m.state) onState(m.state);
  else if(m.type==='caption') addCaption(m);
};
</script>
</body>
</html>
