<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>My Assistant overlay</title>
<style>
  :root{ --ink:#f4f4f5; --pill:#1c1c1e; --pill-2:#2a2a2d; --line:rgba(255,255,255,.12); --blue:#2f6bff; --red:#e5484d; --mut:#9a9aa0; }
  *{box-sizing:border-box;-webkit-user-select:none;user-select:none}
  html,body{margin:0;padding:0;background:transparent;overflow:hidden;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue",sans-serif;-webkit-font-smoothing:antialiased}
  body{display:grid;place-items:center;height:100vh}
  .hidden{display:none!important}

  /* ---------------- Dictation Pill (always dark) ---------------- */
  #pillWrap{display:grid;place-items:center}
  /* small + cute, hugs the bottom rim (Handy-style) */
  .pill{display:inline-flex;align-items:center;gap:9px;background:var(--pill);color:var(--ink);
        border:1px solid var(--line);border-radius:999px;padding:0 13px;
        box-shadow:0 6px 20px rgba(0,0,0,.45);height:32px}
  .pill .rec{width:8px;height:8px;flex:none;border-radius:50%;background:var(--red);animation:pulse 1.5s ease-in-out infinite}
  @keyframes pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.4;transform:scale(.8)}}
  .pill .wave{display:flex;align-items:center;gap:2.5px;height:14px}
  .pill .wave i{width:2.5px;height:4px;border-radius:2px;background:linear-gradient(180deg,#8fb0ff,#2f6bff);animation:wv 1s ease-in-out infinite}
  .pill .wave i:nth-child(2){animation-delay:.14s} .pill .wave i:nth-child(3){animation-delay:.28s}
  .pill .wave i:nth-child(4){animation-delay:.42s} .pill .wave i:nth-child(5){animation-delay:.20s}
  @keyframes wv{0%,100%{height:4px}50%{height:14px}}
  .pill .timer{font-variant-numeric:tabular-nums;font-size:12px;font-weight:600;min-width:28px;text-align:center}
  .pill .spin{width:14px;height:14px;border-radius:50%;border:2.2px solid rgba(255,255,255,.25);border-top-color:#fff;animation:sp .8s linear infinite}
  @keyframes sp{to{transform:rotate(360deg)}}
  .pill .lbl{font-size:12px;font-weight:560}

  /* ---------------- Menu Bar Tray dropdown (theme-aware) ---------------- */
  #trayWrap{--bg:#ffffff;--tink:#1b1b1e;--tink2:#5b5b61;--tink3:#8b8b91;--tline:rgba(0,0,0,.08);--tsurf:#f4f3f1;--tblue:#2f6bff;--tred:#e5484d;
            width:300px;padding:7px;background:var(--bg);border:1px solid var(--tline);border-radius:15px;
            box-shadow:0 18px 50px rgba(0,0,0,.22);color:var(--tink);font-size:13px}
  @media (prefers-color-scheme:dark){ #trayWrap{--bg:#1f1f22;--tink:#f4f4f5;--tink2:#b9b9bf;--tink3:#85858b;--tline:rgba(255,255,255,.1);--tsurf:#2b2b2f} }
  .tr-head{display:flex;align-items:center;gap:10px;padding:8px 9px 10px}
  .tr-head img{width:30px;height:30px;border-radius:8px}
  .tr-hn{font-weight:650;font-size:14px;line-height:1.1}
  .tr-hs{font-size:11.5px;color:var(--tink3);margin-top:2px;display:flex;align-items:center;gap:5px}
  .tr-hs .d{width:6px;height:6px;border-radius:50%;background:var(--tred)}
  .tr-ver{margin-left:auto;font-size:11px;color:var(--tink3)}
  .tr-sep{height:1px;background:var(--tline);margin:5px 6px}
  .tr-active{display:flex;flex-direction:column}
  .tr-row{display:flex;align-items:center;gap:10px;padding:8px 9px;border-radius:9px}
  .tr-row .ri{width:26px;height:26px;flex:none;border-radius:7px;background:var(--tsurf);display:grid;place-items:center;color:var(--tink)}
  .tr-row .ri svg{width:15px;height:15px} .tr-row .ri .live{width:8px;height:8px;border-radius:50%;background:var(--tred)}
  .tr-rc{flex:1;min-width:0} .tr-rt{font-weight:600;font-size:13px} .tr-rm{font-size:11px;color:var(--tink3);margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .tr-stop{font-size:12px;font-weight:600;color:var(--tred);background:none;border:none;cursor:pointer;padding:4px 6px;border-radius:7px}
  .tr-stop:hover{background:color-mix(in srgb,var(--tred) 12%,transparent)}
  .tr-item{display:flex;align-items:center;gap:10px;padding:7px 9px;border-radius:9px;cursor:pointer;color:var(--tink)}
  .tr-item:hover{background:var(--tsurf)}
  .tr-item .mi{width:20px;display:grid;place-items:center;color:var(--tink2)} .tr-item .mi svg{width:16px;height:16px}
  .tr-item .mt{flex:1;font-size:13px;font-weight:500}
  .tr-item .sc{font-size:11.5px;color:var(--tink3);font-weight:500}
</style>

<div id="pillWrap" class="hidden"></div>
<div id="trayWrap" class="hidden"></div>

<script>
const $=s=>document.querySelector(s);
const WIN=new URLSearchParams(location.search).get('win')||'pill';
const T=()=>window.__TAURI__?.core;
function inv(action,extra){ try{ T()?.invoke('overlay_action',{action,...(extra||{})}); }catch(e){} }
async function post(url,body){ try{ await fetch(url,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body||{})}); }catch{} }
function esc(s){ return String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
function fmt(s){ s=Math.max(0,s|0); const m=Math.floor(s/60); return m+':'+String(s%60).padStart(2,'0'); }

const IC={
  mic:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="2.5" width="6" height="11" rx="3"/><path d="M5.5 11a6.5 6.5 0 0 0 13 0"/><line x1="12" y1="17.5" x2="12" y2="21"/></svg>',
  write:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 5.5A1.5 1.5 0 0 1 5.5 4h13A1.5 1.5 0 0 1 20 5.5V14a1.5 1.5 0 0 1-1.5 1.5H9l-4 3.4V5.5Z"/></svg>',
  video:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="6" width="13" height="12" rx="2"/><path d="M16 10l5-3v10l-5-3"/></svg>',
  app:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="4"/></svg>',
  gear:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><line x1="4" y1="9" x2="20" y2="9"/><line x1="4" y1="15" x2="20" y2="15"/><circle cx="15" cy="9" r="2.3" fill="currentColor" stroke="none"/><circle cx="9" cy="15" r="2.3" fill="currentColor" stroke="none"/></svg>',
  quit:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M14 5h4a1 1 0 0 1 1 1v12a1 1 0 0 1-1 1h-4"/><path d="M10 12H3M6 8l-3 4 3 4"/></svg>',
  chev:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg>',
};

// ---------- live state (mirrors the main app via the same SSE) ----------
let dict={phase:'idle', sec:0, since:0}, call={rec:false, sec:0, since:0, title:'', app:''}, minimized=false, tick=null;
function loop(){ const now=Date.now();
  if(dict.phase==='listening') dict.sec=Math.floor((now-dict.since)/1000);
  if(call.rec) call.sec=call.since?Math.floor((now-call.since)/1000):call.sec;
  render();
}
function ensureTick(){ if(!tick) tick=setInterval(loop,1000); }

const es=new EventSource('/events');
es.onmessage=e=>{ let m; try{m=JSON.parse(e.data)}catch{return}
  if(m.type==='dictation-state'){ const p=m.phase||(m.listening?'listening':'idle');
    if(p==='listening'&&dict.phase!=='listening'){ dict.since=Date.now(); dict.sec=0; }
    dict.phase=p; ensureTick(); render();
  } else if(m.type==='state'&&m.state){ const s=m.state;
    if('inMeeting' in s){ if(s.inMeeting&&!call.rec){ call.since=s.startedAt||Date.now(); } call.rec=!!s.inMeeting; }
    if(s.title) call.title=s.title; if(s.app) call.app=s.app;
    render();
  }
};
// seed from current state on open
fetch('/api/state').then(r=>r.json()).then(s=>{ if(s.inMeeting){ call.rec=true; call.since=s.startedAt||Date.now(); call.title=s.title||''; call.app=s.app||''; } ensureTick(); render(); }).catch(()=>render());

// ---------- render ----------
function render(){ WIN==='tray' ? renderTray() : renderPill(); }

function renderPill(){
  // Rust owns the WINDOW show/hide (dict_feedback) — this only fills it with content, so the two no longer
  // fight (that double-control was why the pill flickered / "came earlier, not now").
  const w=$('#pillWrap'), active=dict.phase==='listening'||dict.phase==='transcribing';
  if(!active){ w.classList.add('hidden'); return; }
  w.classList.remove('hidden');
  if(dict.phase==='transcribing'){
    w.innerHTML=`<div class="pill"><div class="spin"></div><span class="lbl">Transcribing…</span></div>`;
    return;
  }
  w.innerHTML=`<div class="pill">
    <span class="rec"></span>
    <div class="wave"><i></i><i></i><i></i><i></i><i></i></div>
    <span class="timer">${fmt(dict.sec)}</span>
  </div>`;
}

function renderTray(){
  const w=$('#trayWrap'); w.classList.remove('hidden');
  const dictating=dict.phase==='listening'||dict.phase==='transcribing';
  const statusTxt=[dictating?'Dictating':null, call.rec?'Recording':null].filter(Boolean).join(' · ')||'Idle';
  const active=[];
  if(dictating) active.push(`<div class="tr-row"><div class="ri">${IC.mic}</div><div class="tr-rc"><div class="tr-rt">Dictating</div><div class="tr-rm">${dict.phase==='transcribing'?'Transcribing…':fmt(dict.sec)+' · Notes'}</div></div><button class="tr-stop" data-a="stop_dictation">Stop</button></div>`);
  if(call.rec) active.push(`<div class="tr-row"><div class="ri"><span class="live"></span></div><div class="tr-rc"><div class="tr-rt">Recording meeting</div><div class="tr-rm">${fmt(call.sec)} · ${esc(call.title||'In a call')}</div></div><button class="tr-stop" data-a="stop_recording">Stop</button></div>`);
  const activeHTML = active.length ? `<div class="tr-active">${active.join('')}</div><div class="tr-sep"></div>` : '';
  const quick=[];
  if(dictating) quick.push(['stop_dictation',IC.mic,'Stop dictation','⌥Space']);
  if(call.rec)  quick.push(['stop_recording',IC.video,'Stop meeting recording','⌥⇧R']);
  quick.push(['open_writing',IC.write,'Open Writing Assistant','⌥⇧W']);
  const quickHTML = quick.length ? `${quick.map(q=>`<div class="tr-item" data-a="${q[0]}"><div class="mi">${q[1]}</div><div class="mt">${q[2]}</div><div class="sc">${q[3]}</div></div>`).join('')}<div class="tr-sep"></div>` : '';
  w.innerHTML=`
    <div class="tr-head"><img src="/logo.png" alt=""><div><div class="tr-hn">My Assistant</div><div class="tr-hs">${dictating||call.rec?'<span class="d"></span>':''}${esc(statusTxt)}</div></div><div class="tr-ver">v0.1</div></div>
    <div class="tr-sep"></div>
    ${activeHTML}${quickHTML}
    <div class="tr-item" data-a="open_main"><div class="mi">${IC.app}</div><div class="mt">Open My Assistant</div><div class="sc">⌥⇧A</div></div>
    <div class="tr-item" data-a="settings"><div class="mi">${IC.gear}</div><div class="mt">Settings…</div><div class="sc">⌘,</div></div>
    <div class="tr-item" data-a="quit"><div class="mi">${IC.quit}</div><div class="mt">Quit My Assistant</div><div class="sc">⌘Q</div></div>`;
  w.querySelectorAll('[data-a]').forEach(elm=>elm.onclick=()=>{
    const a=elm.dataset.a;
    if(a==='stop_recording') post('/api/meeting/control',{action:'stop'});
    else inv(a);          // stop_dictation / open_main / settings / quit → Rust (overlay_action)
    if(a!=='stop_recording') inv('tray_hide');
  });
}
render();
</script>
