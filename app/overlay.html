<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>My Assistant overlay</title>
<style>
  :root{ --ink:#f4f4f5; --pill:#1c1c1e; --line:rgba(255,255,255,.12); --blue:#2f6bff; --red:#e5484d; }
  *{box-sizing:border-box;-webkit-user-select:none;user-select:none}
  html,body{margin:0;padding:0;background:transparent;overflow:hidden;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue",sans-serif;-webkit-font-smoothing:antialiased}
  body{display:grid;place-items:center;height:100vh}
  .hidden{display:none!important}

  /* ---------------- Dictation Pill (always dark) ---------------- */
  #pillWrap{display:grid;place-items:center}
  /* small + cute, hugs the screen rim (Handy-style) */
  .pill{display:inline-flex;align-items:center;gap:9px;background:var(--pill);color:var(--ink);
        border:1px solid var(--line);border-radius:999px;padding:0 13px;
        box-shadow:0 6px 20px rgba(0,0,0,.45);height:32px}
  .pill .rec{width:8px;height:8px;flex:none;border-radius:50%;background:var(--red);animation:pulse 1.5s ease-in-out infinite}
  @keyframes pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.4;transform:scale(.8)}}
  .pill .wave{display:flex;align-items:center;gap:2.5px;height:14px}
  .pill .wave i{width:2.5px;height:4px;border-radius:2px;background:linear-gradient(180deg,#8fb0ff,#2f6bff);animation:wv 1s ease-in-out infinite}
  .pill .wave i:nth-child(2){animation-delay:.14s} .pill .wave i:nth-child(3){animation-delay:.28s}
  .pill .wave i:nth-child(4){animation-delay:.42s} .pill .wave i:nth-child(5){animation-delay:.20s}
  @keyframes wv{0%,100%{height:4px}50%{height:14px}}
  .pill .timer{font-variant-numeric:tabular-nums;font-size:12px;font-weight:600;min-width:28px;text-align:center}
  .pill .spin{width:14px;height:14px;border-radius:50%;border:2.2px solid rgba(255,255,255,.25);border-top-color:#fff;animation:sp .8s linear infinite}
  @keyframes sp{to{transform:rotate(360deg)}}
  .pill .lbl{font-size:12px;font-weight:560}
</style>

<div id="pillWrap" class="hidden"></div>

<script>
// This page hosts ONLY the floating Dictation Pill. (The menu-bar dropdown is a native macOS menu now, so
// there is no tray webview to render here.) The app process owns the window show/hide via dict_feedback;
// this script just mirrors the live dictation phase from the server's SSE and fills the pill with content.
const $=s=>document.querySelector(s);
function fmt(s){ s=Math.max(0,s|0); const m=Math.floor(s/60); return m+':'+String(s%60).padStart(2,'0'); }

let dict={phase:'idle', sec:0, since:0}, tick=null;
function loop(){ if(dict.phase==='listening') dict.sec=Math.floor((Date.now()-dict.since)/1000); renderPill(); }
function ensureTick(){ if(!tick) tick=setInterval(loop,1000); }

const es=new EventSource('/events');
es.onmessage=e=>{ let m; try{m=JSON.parse(e.data)}catch{return}
  if(m.type==='dictation-state'){ const p=m.phase||(m.listening?'listening':'idle');
    if(p==='listening'&&dict.phase!=='listening'){ dict.since=Date.now(); dict.sec=0; }
    dict.phase=p; ensureTick(); renderPill();
  }
};

function renderPill(){
  const w=$('#pillWrap'), active=dict.phase==='listening'||dict.phase==='transcribing';
  if(!active){ w.classList.add('hidden'); return; }
  w.classList.remove('hidden');
  if(dict.phase==='transcribing'){
    w.innerHTML=`<div class="pill"><div class="spin"></div><span class="lbl">Transcribing…</span></div>`;
    return;
  }
  w.innerHTML=`<div class="pill">
    <span class="rec"></span>
    <div class="wave"><i></i><i></i><i></i><i></i><i></i></div>
    <span class="timer">${fmt(dict.sec)}</span>
  </div>`;
}
renderPill();
</script>
