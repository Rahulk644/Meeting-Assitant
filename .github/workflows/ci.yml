name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  server-tests:
    name: Server tests (node --test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Run tests
        working-directory: app
        run: npm test

  desktop-check:
    name: Desktop compile check (cargo)
    runs-on: macos-latest # links Core Audio / CoreGraphics / AppKit — macOS only
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri
      - name: cargo check
        working-directory: desktop/src-tauri
        run: cargo check --locked
      - name: cargo test
        working-directory: desktop/src-tauri
        run: cargo test --locked
      - name: Type-check Swift helpers
        run: |
          xcrun swiftc -typecheck meeting-state/meeting-state.swift
          xcrun swiftc -typecheck stt/meeting-tap.swift
      - name: Run native helper self-tests
        run: |
          xcrun swiftc -O meeting-state/meeting-state.swift -o "$RUNNER_TEMP/meeting-state"
          xcrun swiftc -O stt/meeting-tap.swift -o "$RUNNER_TEMP/meeting-tap" \
            -framework ScreenCaptureKit -framework AVFoundation -framework CoreMedia \
            -framework CoreAudio -framework CoreImage
          "$RUNNER_TEMP/meeting-state" --selftest
          "$RUNNER_TEMP/meeting-tap" --selftest
